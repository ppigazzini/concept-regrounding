name: test

on: [push, pull_request]

jobs:
  test:
    name: lint, types, tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { version: "0.13.5", python-version: "3.14", enable-cache: true }
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run python tools/check_markdown.py
      - run: uv run pytest

  # One runner per published study: the first seed of each, since a whole study
  # outlasts the runner's timeout.
  study:
    name: study ${{ matrix.study }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        study:
          - regrounding
          - regrounding-palette
          - regrounding-size
          - regrounding-blur
          - regrounding-first
          - regrounding-readout
          - regrounding-converged
          - regrounding-rehearsal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { version: "0.13.5", python-version: "3.14", enable-cache: true }
      - run: uv sync --locked
      - run: uv run python tools/study.py --check docs/studies/${{ matrix.study }}.json --seeds 1
